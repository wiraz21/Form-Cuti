<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Cuti Pegawai</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#0F2942;
    --navy-800:#16344F;
    --navy-700:#1D4E6B;
    --blue-500:#2C6E8E;
    --blue-100:#E7EFF3;
    --amber-500:#C9922A;
    --amber-100:#FBF1DE;
    --bg:#F4F6F8;
    --card:#FFFFFF;
    --ink:#1A2530;
    --ink-soft:#5B6B78;
    --border:#DCE3E8;
    --success:#2F7A4F;
    --success-bg:#E8F3EC;
    --danger:#C0402F;
    --danger-bg:#FBEAE7;
    --warning:#B7791F;
    --warning-bg:#FBF1DE;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Plus Jakarta Sans',sans-serif;margin:0;color:var(--navy-900);}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ===== Top bar ===== */
  .topbar{
    background:var(--navy-900);
    color:#fff;
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 2px 8px rgba(15,41,66,0.15);
  }
  .topbar .brand{display:flex;align-items:center;gap:12px;}
  .topbar .crest{
    width:38px;height:38px;border-radius:8px;
    background:linear-gradient(155deg,var(--amber-500),#8f6416);
    display:flex;align-items:center;justify-content:center;
    font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:15px;color:#1a1000;
    flex-shrink:0;
  }
  .topbar .brand-text .t1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15px;line-height:1.2;}
  .topbar .brand-text .t2{font-size:12px;color:#B9C7D3;}
  .topbar .who{display:flex;align-items:center;gap:14px;font-size:13px;}
  .topbar .who .name{font-weight:600;}
  .btn-logout{
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.2);
    color:#fff;padding:7px 14px;border-radius:7px;
    font-size:13px;cursor:pointer;font-family:inherit;
  }
  .btn-logout:hover{background:rgba(255,255,255,0.18);}

  /* ===== Layout ===== */
  .shell{flex:1;display:flex;width:100%;max-width:1180px;margin:0 auto;padding:24px;gap:24px;}
  .tabs{display:flex;flex-direction:column;gap:6px;min-width:210px;flex-shrink:0;}
  .tab-btn{
    text-align:left;padding:11px 14px;border-radius:8px;border:1px solid transparent;
    background:transparent;color:var(--ink-soft);font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;
    cursor:pointer;display:flex;align-items:center;gap:9px;transition:all .15s;
  }
  .tab-btn:hover{background:var(--blue-100);color:var(--navy-800);}
  .tab-btn.active{background:var(--navy-900);color:#fff;}
  .tab-btn .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;flex-shrink:0;}
  .content{flex:1;min-width:0;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:24px;margin-bottom:20px;
  }
  .card h2{font-size:17px;margin-bottom:4px;}
  .card .sub{color:var(--ink-soft);font-size:13px;margin-bottom:18px;}

  /* ===== Login screen ===== */
  .login-wrap{
    flex:1;display:flex;align-items:center;justify-content:center;padding:24px;
    background:
      radial-gradient(circle at 15% 20%, rgba(44,110,142,0.12), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(201,146,42,0.10), transparent 45%),
      var(--bg);
  }
  .login-card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    width:100%;max-width:400px;padding:32px 30px;box-shadow:0 12px 32px rgba(15,41,66,0.08);
  }
  .login-crest{
    width:52px;height:52px;border-radius:12px;margin:0 auto 16px;
    background:linear-gradient(155deg,var(--amber-500),#8f6416);
    display:flex;align-items:center;justify-content:center;
    font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:19px;color:#1a1000;
  }
  .login-card h1{font-size:19px;text-align:center;}
  .login-card .lead{text-align:center;color:var(--ink-soft);font-size:13px;margin-top:4px;margin-bottom:22px;}
  .role-switch{display:flex;background:var(--blue-100);border-radius:9px;padding:4px;margin-bottom:20px;}
  .role-switch button{
    flex:1;border:none;background:transparent;padding:9px 0;border-radius:7px;
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;color:var(--navy-700);cursor:pointer;
  }
  .role-switch button.active{background:#fff;box-shadow:0 1px 4px rgba(15,41,66,0.12);color:var(--navy-900);}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--navy-800);margin-bottom:6px;}
  .field{margin-bottom:16px;}
  input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
    font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);background:#fff;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-500);outline-offset:1px;border-color:var(--blue-500);}
  textarea{resize:vertical;min-height:64px;}
  .btn{
    padding:10px 18px;border-radius:8px;border:none;font-family:'Inter',sans-serif;font-weight:600;
    font-size:13.5px;cursor:pointer;transition:transform .05s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--navy-900);color:#fff;width:100%;padding:11px 0;}
  .btn-primary:hover{background:var(--navy-800);}
  .btn-secondary{background:var(--blue-100);color:var(--navy-800);}
  .btn-secondary:hover{background:#d9e6ec;}
  .btn-danger{background:var(--danger-bg);color:var(--danger);}
  .btn-danger:hover{background:#f6d9d3;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--border);}
  .err-msg{background:var(--danger-bg);color:var(--danger);font-size:12.5px;padding:9px 12px;border-radius:7px;margin-bottom:14px;}
  .ok-msg{background:var(--success-bg);color:var(--success);font-size:12.5px;padding:9px 12px;border-radius:7px;margin-bottom:14px;}

  /* ===== Form grid ===== */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .jenis-cuti-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px;}
  .jenis-opt{
    display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--border);
    border-radius:8px;cursor:pointer;font-size:13px;
  }
  .jenis-opt.checked{border-color:var(--navy-700);background:var(--blue-100);}
  .jenis-opt input{margin:0;}

  /* ===== Tables ===== */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);}
  th{color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge-pending{background:var(--warning-bg);color:var(--warning);}
  .row-actions{display:flex;gap:6px;}
  .row-actions button{padding:6px 10px;font-size:12px;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty-state .big{font-size:32px;margin-bottom:8px;}

  /* ===== Modal ===== */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,41,66,0.45);display:flex;align-items:center;
    justify-content:center;z-index:100;padding:20px;
  }
  .modal{background:#fff;border-radius:12px;padding:26px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;}
  .modal h3{font-size:16px;margin-bottom:16px;}

  /* ===== Print area (hidden on screen) ===== */
  #print-area{display:none;}
  @media print{
    @page{ size: A4; margin: 10mm 12mm; }
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{
      display:block;position:absolute;top:0;left:0;width:100%;padding:0;
      font-family:'Inter',sans-serif;color:#000;
    }
  }
  .pf-table{width:100%;border-collapse:collapse;font-size:11px;}
  .pf-table td{border:1px solid #000;padding:3px 6px;vertical-align:top;line-height:1.3;}
  .pf-section-title{font-weight:700;background:#eee;padding-top:2px;padding-bottom:2px;}
  .pf-title{text-align:center;font-weight:700;font-size:13.5px;margin:8px 0;text-transform:uppercase;}
  .pf-header-right{text-align:right;font-size:11px;margin-bottom:4px;}
  .pf-check{display:inline-block;width:11px;height:11px;border:1px solid #000;margin-right:5px;vertical-align:middle;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .helper{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  ::placeholder{color:#A8B4BD;}
</style>
</head>
<body>
<div id="app"></div>

<div id="print-area"></div>

<script>
/* ============ KONFIGURASI BACKEND ============ */
/* WAJIB DIISI: tempel URL Web App Google Apps Script kamu di sini setelah deploy.
   Lihat panduan "Cara Deploy Backend" yang disertakan terpisah.
   Contoh: 'https://script.google.com/macros/s/AKfycb.../exec' */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwfjBZkKBEh9NxFG4vm2iH6-0jErScoaOGAVuoqo08T6JU3mCgRLuW8fWZ8S7Svf4ANWA/exec';

/* ============ STORAGE HELPERS (via Google Apps Script) ============ */
const SETTINGS_KEY = 'cuti-app-settings';
const EMPLOYEES_KEY = 'cuti-app-employees';
const REQUESTS_KEY = 'cuti-app-requests';

async function storageGet(key, fallback){
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=get&key=${encodeURIComponent(key)}`);
    if(!res.ok) return fallback;
    const data = await res.json();
    return (data && data.value !== undefined && data.value !== null) ? JSON.parse(data.value) : fallback;
  }catch(e){
    console.error('Storage get error', e);
    return fallback;
  }
}
async function storageSet(key, value){
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // text/plain menghindari CORS preflight yang tidak didukung Apps Script
      body: JSON.stringify({ action:'set', key, value: JSON.stringify(value) })
    });
    if(!res.ok) return false;
    const data = await res.json();
    return !!(data && data.ok);
  }catch(e){
    console.error('Storage set error', e);
    return false;
  }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

const JENIS_CUTI = [
  'Cuti Tahunan','Cuti Besar','Cuti Sakit','Cuti Melahirkan',
  'Cuti Karena Alasan Penting','Cuti di Luar Tanggungan Negara'
];

/* ============ APP STATE ============ */
let state = {
  loading:true,
  settings:null,
  employees:[],
  requests:[],
  session:null,      // {role:'pegawai'|'admin', employeeId?}
  view:'ajukan',      // pegawai: ajukan | riwayat  | admin: pegawai | pengajuan | pengaturan
  loginRole:'pegawai',
  modal:null,
};

async function loadAll(){
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'PASTE_URL_WEB_APP_DI_SINI'){
    state.configMissing = true;
    state.loading = false;
    render();
    return;
  }
  let settings = await storageGet(SETTINGS_KEY, null);
  if(!settings){
    settings = { adminPin:'admin2026', tempat:'Medan', instansiTujuan:'Kepala BBGTK Sumatera Utara', sheetUrl:'', lastSync:null,
      kabagJabatan:'Kabag Tata Usaha', kabagNama:'', kabagNip:'',
      kabalaiJabatan:'Ka. Balai', kabalaiNama:'', kabalaiNip:'' };
    await storageSet(SETTINGS_KEY, settings);
  }
  if(settings.sheetUrl === undefined) settings.sheetUrl = '';
  if(settings.lastSync === undefined) settings.lastSync = null;
  if(settings.kabagJabatan === undefined) settings.kabagJabatan = 'Kabag Tata Usaha';
  if(settings.kabagNama === undefined) settings.kabagNama = '';
  if(settings.kabagNip === undefined) settings.kabagNip = '';
  if(settings.kabalaiJabatan === undefined) settings.kabalaiJabatan = 'Ka. Balai';
  if(settings.kabalaiNama === undefined) settings.kabalaiNama = '';
  if(settings.kabalaiNip === undefined) settings.kabalaiNip = '';
  state.settings = settings;
  state.employees = await storageGet(EMPLOYEES_KEY, []);
  state.requests = await storageGet(REQUESTS_KEY, []);
  state.loading = false;
  render();
}

/* ============ RENDER ROOT ============ */
function render(){
  const app = document.getElementById('app');
  if(state.configMissing){
    app.innerHTML = `<div class="login-wrap"><div class="login-card" style="text-align:center;">
      <div class="login-crest">⚠</div>
      <h1>Backend Belum Dikonfigurasi</h1>
      <div class="lead">Buka file HTML ini di editor teks, cari baris <span class="mono">APPS_SCRIPT_URL</span> di bagian atas kode, dan ganti dengan URL Web App Google Apps Script kamu. Lihat panduan deployment yang disertakan.</div>
    </div></div>`;
    return;
  }
  if(state.loading){
    app.innerHTML = `<div class="login-wrap"><div style="color:var(--ink-soft);font-size:13px;">Memuat...</div></div>`;
    return;
  }
  if(!state.session){
    app.innerHTML = renderLogin();
    attachLoginEvents();
    return;
  }
  app.innerHTML = renderShell();
  attachShellEvents();
}

/* ============ LOGIN VIEW ============ */
function renderLogin(){
  const role = state.loginRole;
  const empOptions = state.employees.map(e=>`<option value="${e.id}">${escapeHtml(e.nama)} — ${escapeHtml(e.nip)}</option>`).join('');
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-crest">BB</div>
      <h1>Sistem Cuti Pegawai</h1>
      <div class="lead">BBGTK Sumatera Utara</div>
      <div class="role-switch">
        <button data-role="pegawai" class="${role==='pegawai'?'active':''}">Pegawai</button>
        <button data-role="admin" class="${role==='admin'?'active':''}">Admin</button>
      </div>
      <div id="login-error"></div>
      ${role==='pegawai' ? `
        <form id="login-form">
          <div class="field">
            <label>Nama Pegawai</label>
            ${state.employees.length===0
              ? `<div class="helper" style="margin-bottom:0;">Belum ada data pegawai. Hubungi admin untuk didaftarkan.</div>`
              : `<select id="emp-select" required><option value="">Pilih nama...</option>${empOptions}</select>`
            }
          </div>
          ${state.employees.length>0 ? `
          <div class="field">
            <label>PIN</label>
            <input type="password" id="emp-pin" placeholder="Masukkan PIN" required>
          </div>
          <button type="submit" class="btn btn-primary">Masuk</button>
          ` : ''}
        </form>
      ` : `
        <form id="login-form">
          <div class="field">
            <label>PIN Admin</label>
            <input type="password" id="admin-pin" placeholder="Masukkan PIN admin" required>
          </div>
          <button type="submit" class="btn btn-primary">Masuk sebagai Admin</button>
        </form>
      `}
    </div>
  </div>`;
}

function attachLoginEvents(){
  document.querySelectorAll('.role-switch button').forEach(b=>{
    b.onclick = ()=>{ state.loginRole = b.dataset.role; render(); };
  });
  const form = document.getElementById('login-form');
  if(!form) return;
  form.onsubmit = (ev)=>{
    ev.preventDefault();
    const errBox = document.getElementById('login-error');
    errBox.innerHTML = '';
    if(state.loginRole==='admin'){
      const pin = document.getElementById('admin-pin').value.trim();
      if(pin === state.settings.adminPin){
        state.session = { role:'admin' };
        state.view = 'pegawai';
        render();
      }else{
        errBox.innerHTML = `<div class="err-msg">PIN admin salah.</div>`;
      }
    }else{
      const empId = document.getElementById('emp-select').value;
      const pin = document.getElementById('emp-pin').value.trim();
      const emp = state.employees.find(e=>e.id===empId);
      if(!emp){ errBox.innerHTML = `<div class="err-msg">Pilih nama pegawai.</div>`; return; }
      if(pin === emp.pin){
        state.session = { role:'pegawai', employeeId:emp.id };
        state.view = 'ajukan';
        render();
      }else{
        errBox.innerHTML = `<div class="err-msg">PIN salah.</div>`;
      }
    }
  };
}

/* ============ SHELL (post-login) ============ */
function renderShell(){
  const isAdmin = state.session.role === 'admin';
  const emp = isAdmin ? null : state.employees.find(e=>e.id===state.session.employeeId);
  const whoName = isAdmin ? 'Administrator' : (emp ? emp.nama : '');
  const whoRole = isAdmin ? 'Admin Sistem' : (emp ? emp.jabatan : '');

  const tabs = isAdmin ? [
    {id:'pegawai', label:'Kelola Pegawai'},
    {id:'pengajuan', label:'Semua Pengajuan'},
    {id:'pengaturan', label:'Pengaturan'},
  ] : [
    {id:'ajukan', label:'Ajukan Cuti'},
    {id:'riwayat', label:'Riwayat Saya'},
  ];

  return `
  <div class="topbar">
    <div class="brand">
      <div class="crest">BB</div>
      <div class="brand-text">
        <div class="t1">Sistem Cuti Pegawai</div>
        <div class="t2">BBGTK Sumatera Utara</div>
      </div>
    </div>
    <div class="who">
      <div style="text-align:right;">
        <div class="name">${escapeHtml(whoName)}</div>
        <div style="font-size:11.5px;color:#B9C7D3;">${escapeHtml(whoRole)}</div>
      </div>
      <button class="btn-logout" id="logout-btn">Keluar</button>
    </div>
  </div>
  <div class="shell">
    <div class="tabs">
      ${tabs.map(t=>`<button class="tab-btn ${state.view===t.id?'active':''}" data-view="${t.id}"><span class="dot"></span>${t.label}</button>`).join('')}
    </div>
    <div class="content">
      ${isAdmin ? renderAdminView() : renderPegawaiView(emp)}
    </div>
  </div>
  ${state.modal ? renderModal() : ''}
  `;
}

function attachShellEvents(){
  document.getElementById('logout-btn').onclick = ()=>{
    state.session = null;
    state.loginRole = 'pegawai';
    render();
  };
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.onclick = ()=>{ state.view = b.dataset.view; state.modal=null; render(); };
  });
  if(state.session.role==='admin'){
    attachAdminEvents();
  }else{
    attachPegawaiEvents();
  }
  attachModalEvents();
  attachPrintButtons();
}

// Wires every visible "Cetak" button (Riwayat, admin tables, modal) — called on every render
function attachPrintButtons(){
  document.querySelectorAll('[data-print]').forEach(btn=>{
    btn.onclick = ()=>{
      const r = state.requests.find(x=>x.id===btn.dataset.print);
      if(r) printRequest(r);
    };
  });
}

/* ============ PEGAWAI: AJUKAN CUTI ============ */
function renderPegawaiView(emp){
  if(!emp) return `<div class="card">Data pegawai tidak ditemukan.</div>`;
  if(state.view === 'ajukan') return renderAjukanForm(emp);
  return renderRiwayat(emp);
}

function renderAjukanForm(emp){
  return `
  <div class="card">
    <h2>Ajukan Cuti</h2>
    <div class="sub">Isi formulir berikut. Data pegawai terisi otomatis dari sistem.</div>

    <h4 style="font-size:12.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;">I. Data Pegawai</h4>
    <div class="grid2" style="margin-bottom:18px;">
      <div class="field"><label>Nama</label><input type="text" value="${escapeHtml(emp.nama)}" disabled></div>
      <div class="field"><label>NIP</label><input type="text" value="${escapeHtml(emp.nip)}" disabled></div>
      <div class="field"><label>Jabatan</label><input type="text" value="${escapeHtml(emp.jabatan)}" disabled></div>
      <div class="field"><label>Unit Kerja</label><input type="text" value="${escapeHtml(emp.unitKerja)}" disabled></div>
      <div class="field"><label>Masa Kerja</label><input type="text" value="${escapeHtml(resolveMasaKerja(emp))}" disabled></div>
      <div class="field"><label>Sisa Cuti Tahun Berjalan (N)</label><input type="text" value="${escapeHtml(String(emp.sisaCutiN ?? '-'))} hari" disabled></div>
    </div>

    <form id="ajukan-form">
      <h4 style="font-size:12.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;">II. Jenis Cuti</h4>
      <div class="jenis-cuti-grid" id="jenis-grid">
        ${JENIS_CUTI.map((j,i)=>`
          <label class="jenis-opt" data-idx="${i}">
            <input type="radio" name="jenisCuti" value="${escapeHtml(j)}" ${i===0?'required':''}>
            ${escapeHtml(j)}
          </label>
        `).join('')}
      </div>

      <div class="field" style="margin-top:14px;">
        <label>III. Alasan Cuti</label>
        <textarea id="alasan" placeholder="Contoh: Keperluan keluarga" required></textarea>
      </div>

      <h4 style="font-size:12.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin:16px 0 10px;">IV. Lamanya Cuti</h4>

function attachPegawaiEvents(){
  if(state.view==='ajukan'){
    document.querySelectorAll('.jenis-opt').forEach(opt=>{
      opt.addEventListener('click', ()=>{
        document.querySelectorAll('.jenis-opt').forEach(o=>o.classList.remove('checked'));
        opt.classList.add('checked');
        opt.querySelector('input').checked = true;
      });
    });
    const mulai = document.getElementById('tgl-mulai');
    const selesai = document.getElementById('tgl-selesai');
    const hari = document.getElementById('lamanya-hari');
    function recalc(){
      if(mulai.value && selesai.value){
        const d1 = new Date(mulai.value), d2 = new Date(selesai.value);
        const diff = Math.round((d2-d1)/86400000)+1;
        if(diff>0) hari.value = diff;
      }
    }
    mulai.addEventListener('change', recalc);
    selesai.addEventListener('change', recalc);

    const form = document.getElementById('ajukan-form');
    form.onsubmit = async (ev)=>{
      ev.preventDefault();
      const emp = state.employees.find(e=>e.id===state.session.employeeId);
      const jenisCuti = form.querySelector('input[name=jenisCuti]:checked');
      const msgBox = document.getElementById('ajukan-msg');
      if(!jenisCuti){ msgBox.innerHTML = `<div class="err-msg">Pilih jenis cuti.</div>`; return; }
      const req = {
        id: uid(),
        employeeId: emp.id,
        nama: emp.nama, nip: emp.nip, jabatan: emp.jabatan, unitKerja: emp.unitKerja, masaKerja: resolveMasaKerja(emp),
        sisaCutiN2: emp.sisaCutiN2, sisaCutiN1: emp.sisaCutiN1, sisaCutiN: emp.sisaCutiN,
        jenisCuti: jenisCuti.value,
        alasan: document.getElementById('alasan').value.trim(),
        tglMulai: document.getElementById('tgl-mulai').value,
        tglSelesai: document.getElementById('tgl-selesai').value,
        lamanyaHari: document.getElementById('lamanya-hari').value || '',
        alamatCuti: document.getElementById('alamat-cuti').value.trim(),
        telpCuti: document.getElementById('telp-cuti').value.trim(),
        tglPengajuan: new Date().toISOString(),
        tempatPengajuan: state.settings.tempat,
        status: 'Diajukan',
      };
      msgBox.innerHTML = `<div class="ok-msg">Membuka dialog cetak...</div>`;
      printThenSave(req, async ()=>{
        state.requests.push(req);
        const ok = await storageSet(REQUESTS_KEY, state.requests);
        if(ok){
          state.view='riwayat';
          render();
        }else{
          msgBox.innerHTML = `<div class="err-msg">Gagal menyimpan setelah cetak. Coba lagi.</div>`;
        }
      });
    };
  }
}

function attachModalEvents(){
  const overlay = document.getElementById('modal-overlay');
  if(!overlay) return;
  overlay.addEventListener('click', (ev)=>{ if(ev.target.id==='modal-overlay'){ state.modal=null; render(); } });
  const cancelBtn = document.getElementById('modal-cancel');
  if(cancelBtn) cancelBtn.onclick = ()=>{ state.modal=null; render(); };

  const empForm = document.getElementById('emp-form');
  const nipInput = document.getElementById('f-nip');
  if(nipInput){
    nipInput.addEventListener('input', ()=>{
      const preview = document.getElementById('nip-masakerja-preview');
      if(preview) preview.textContent = maskaKerjaPreviewText(nipInput.value);
    });
  }
  if(empForm){
    empForm.onsubmit = async (ev)=>{
      ev.preventDefault();
      const data = {
        nama: document.getElementById('f-nama').value.trim(),
        nip: document.getElementById('f-nip').value.trim(),
        jabatan: document.getElementById('f-jabatan').value.trim(),
        unitKerja: document.getElementById('f-unit').value.trim(),
        masaKerjaManual: document.getElementById('f-masakerja-manual').value.trim(),
        pin: document.getElementById('f-pin').value.trim(),
        sisaCutiN2: Number(document.getElementById('f-sisa-n2').value)||0,
        sisaCutiN1: Number(document.getElementById('f-sisa-n1').value)||0,
        sisaCutiN: Number(document.getElementById('f-sisa-n').value)||0,
      };
      if(state.modal.type==='edit-emp'){
        const idx = state.employees.findIndex(x=>x.id===state.modal.id);
        state.employees[idx] = {...state.employees[idx], ...data};
      }else{
        state.employees.push({ id: uid(), ...data });
      }
      const ok = await storageSet(EMPLOYEES_KEY, state.employees);
      const msgBox = document.getElementById('emp-form-msg');
      if(ok){ state.modal=null; render(); }
      else if(msgBox){ msgBox.innerHTML = `<div class="err-msg">Gagal menyimpan.</div>`; }
    };
  }

  const confirmDelBtn = document.getElementById('confirm-del-btn');
  if(confirmDelBtn){
    confirmDelBtn.onclick = async ()=>{
      state.employees = state.employees.filter(e=>e.id!==state.modal.id);
      await storageSet(EMPLOYEES_KEY, state.employees);
      state.modal = null;
      render();
    };
  }

  const saveStatusBtn = document.getElementById('save-status-btn');
  if(saveStatusBtn){
    saveStatusBtn.onclick = async ()=>{
      const idx = state.requests.findIndex(r=>r.id===state.modal.id);
      state.requests[idx].status = document.getElementById('status-select').value;
      await storageSet(REQUESTS_KEY, state.requests);
      state.modal = null;
      render();
    };
  }
  const delReqBtn = document.getElementById('del-req-btn');
  if(delReqBtn){
    delReqBtn.onclick = async ()=>{
      state.requests = state.requests.filter(r=>r.id!==state.modal.id);
      await storageSet(REQUESTS_KEY, state.requests);
      state.modal = null;
      render();
    };
  }
}

async function syncFromSheet(){
  const url = state.settings.sheetUrl;
  if(!url) return { ok:false, msg:'Link Google Sheet belum diisi.' };
  return new Promise((resolve)=>{
    Papa.parse(url, {
      download:true,
      header:true,
      skipEmptyLines:true,
      complete: async (results)=>{
        try{
          const rows = results.data;
          // Menormalkan nama kolom: huruf kecil, buang semua karakter selain huruf/angka.
          // Supaya "Unit Kerja", "unit_kerja", "UNIT-KERJA" dsb semua dianggap sama.
          const normalizeKey = (k)=> String(k).toLowerCase().replace(/[^a-z0-9]/g,'');
          const CANONICAL = {
            nama:'nama', nip:'nip', jabatan:'jabatan', unitkerja:'unitKerja', pin:'pin',
            sisacutin2:'sisaCutiN2', sisacutin1:'sisaCutiN1', sisacutin:'sisaCutiN',
            masakerjamanual:'masaKerjaManual',
          };
          const mapRow = (row)=>{
            const out = {};
            Object.keys(row).forEach(rawKey=>{
              const canon = CANONICAL[normalizeKey(rawKey)];
              if(canon) out[canon] = String(row[rawKey]).trim();
            });
            return {
              nama: out.nama || '',
              nip: out.nip || '',
              jabatan: out.jabatan || '',
              unitKerja: out.unitKerja || '',
              masaKerjaManual: out.masaKerjaManual || '',
              pin: out.pin || '1234',
              sisaCutiN2: Number(out.sisaCutiN2)||0,
              sisaCutiN1: Number(out.sisaCutiN1)||0,
              sisaCutiN: Number(out.sisaCutiN)||0,
            };
          };
          const incoming = rows.map(mapRow).filter(e=>e.nip);

          if(incoming.length===0){
            resolve({ ok:false, msg:'Tidak ada baris valid ditemukan (pastikan kolom NIP terisi).' });
            return;
          }

          const existingByNip = {};
          state.employees.forEach(e=>{ existingByNip[e.nip] = e; });
          const merged = incoming.map(e=>{
            const existing = existingByNip[e.nip];
            return { id: existing ? existing.id : uid(), ...e };
          });

          state.employees = merged;
          await storageSet(EMPLOYEES_KEY, state.employees);
          state.settings.lastSync = new Date().toISOString();
          await storageSet(SETTINGS_KEY, state.settings);
          resolve({ ok:true, msg:`Berhasil sinkron ${merged.length} data pegawai.` });
        }catch(err){
          resolve({ ok:false, msg:'Gagal memproses data: ' + err.message });
        }
      },
      error: (err)=>{
        resolve({ ok:false, msg:'Gagal mengambil data dari link tersebut. Pastikan sheet sudah di-publish sebagai CSV.' });
      }
    });
  });
}

// Re-print an already-saved request (used from Riwayat / admin views)
function printRequest(r){
  const area = document.getElementById('print-area');
  area.innerHTML = buildPrintHtml(r);
  setTimeout(()=>window.print(), 100);
}

// Print a not-yet-saved request, then save it once the print dialog closes
function printThenSave(req, onDone){
  const area = document.getElementById('print-area');
  area.innerHTML = buildPrintHtml(req);
  function afterPrintHandler(){
    window.removeEventListener('afterprint', afterPrintHandler);
    onDone();
  }
  window.addEventListener('afterprint', afterPrintHandler);
  setTimeout(()=>window.print(), 150);
}

/* ============ UTILS ============ */
function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function formatDate(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID', {day:'numeric',month:'long',year:'numeric'});
}
function formatDateShort(dateStr){
  if(!dateStr) return '-';
  const d = new Date(dateStr);
  if(isNaN(d)) return dateStr;
  return d.toLocaleDateString('id-ID', {day:'numeric',month:'long',year:'numeric'});
}

// Standard 18-digit ASN NIP: 8 digit tanggal lahir (YYYYMMDD) + 6 digit TMT CPNS (YYYYMM) + 1 digit gender + 3 digit nomor urut
function parseNipTmt(nip){
  if(!nip) return null;
  const digits = String(nip).replace(/\D/g,'');
  if(digits.length !== 18) return null;
  const year = parseInt(digits.substring(8,12),10);
  const month = parseInt(digits.substring(12,14),10);
  if(!year || year < 1945 || year > 2100 || !month || month < 1 || month > 12) return null;
  return { year, month };
}
function calcMasaKerja(nip, asOf){
  const tmt = parseNipTmt(nip);
  if(!tmt) return null;
  const tmtDate = new Date(tmt.year, tmt.month-1, 1);
  const now = asOf ? new Date(asOf) : new Date();
  let years = now.getFullYear() - tmtDate.getFullYear();
  let months = now.getMonth() - tmtDate.getMonth();
  if(months < 0){ years--; months += 12; }
  if(years < 0) return null;
  return `${years} Tahun ${months} Bulan`;
}
// Resolves the display value: auto from NIP, falling back to a manually entered value for non-standard NIPs
function resolveMasaKerja(emp){
  return calcMasaKerja(emp.nip) || emp.masaKerjaManual || '-';
}
